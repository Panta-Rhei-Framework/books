summary: >
  This Research Note reads Stephen Wolfram's 2026 ruliological exploration of
  P vs NP as an external comparator for a narrower Panta Rhei question: when
  does witness search become finite address construction? The two readings
  are explicitly parallel, not nested. The note specifies a criterion under
  which, in a typed admissible fragment, search admits a constructive
  address-resolution alternative. It does not claim to solve orthodox P vs
  NP, identify the Ruliad with Category tau, or treat Wolfram's finite
  experiments as validation of Panta Rhei.

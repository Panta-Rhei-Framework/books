claim_boundary:
  core: >
    Under finite interface width and a reconstruction discipline, some
    tau-admissible witness problems can be treated as address construction
    rather than blind witness search. The tau-admissibility predicate
    Adm_tau is a propositional predicate on objects of E_2; CRT witness
    reassembly renders as a Hopkins–Bousfield arithmetic fracture-square
    pullback in the verifier-witness fibration; the internal collapse
    tau-P_adm = tau-NP_adm holds with explicit scope qualifier inside the
    theorem environment.
  non_claims:
    - It does not solve orthodox P vs NP.
    - It does not claim P = NP over unrestricted Turing machines.
    - It does not claim that the Ruliad is Category tau.
    - It does not claim Wolfram validates Panta Rhei.
    - It does not claim every NP witness space is tau-admissible.
    - It does not export tau-P_adm = tau-NP_adm without a separate bridge theorem.
    - It does not assert tau-admissibility is ZFC-definable at any specified arithmetic complexity.

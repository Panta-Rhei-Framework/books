summary: >
  This Research Note pre-registers a Category-τ reading of the cluster-substructure
  dichotomy reported in Natarajan, Chiang & Dutra (2026, ApJL 1001, L12) as one
  D-sector readout in two regimes, not two DM components. Three τ-distinctive
  positive readings are committed (outer Newtonian-limit r_t; inner M∂(R)
  number-promotion; transition r_trans = ℓ_cl,sub(M_sub)) plus one numerical anchor
  (r_trans ≈ 3.4–10.8 kpc) and an 11-row N16 falsification surface with one
  headline pre-registered falsifier (host-mass independence of r_trans at fixed
  SHMF). Three derivational gaps are flagged honestly; the inner-density-slope-
  direction tension is reframed as a count-axis-vs-slope-axis discriminator
  in GGSL+kinematics joint inference.
claim_boundary:
  core: >
    Under the τ-framework's capacity-gradient gravity sector and its boundary-
    holonomy mass closure (V.D272), the Natarajan dichotomy is a regime-projection
    of one D-sector readout — collisional-like inner core via M∂(R) number-
    promotion at the host nodal-capacity maximum, collisionless-like outer
    tidal extent via the V.D261 cluster-screening factor (1 + r/ℓ_τ ≈ 1) — with
    a single transition scale ℓ_cl,sub(M_sub) = √(G M_sub / a₀) governed by
    subhalo mass, not by a particle-DM cross-section.
  non_claims:
    - It does not derive the γ ≳ 2.5 inner density slope from existing primitives.
    - It does not derive the SHMF amplitude (slope only).
    - It does not derive the 5σ–40σ inner-excess amplitude (sign-correctly produced via the M∂(R) mechanism; amplitude deferred).
    - It does not claim τ-physics is Lean-verified as external physics.
    - It does not supersede the conjectural status of V.T203 in the KSZ-categorical note.
    - It does not engage Natarajan, Chiang, or Dutra adversarially; the note is offered in the spirit of pre-registration, not adjudication.
